[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quadringent"
version = "0.4.8"
description = "IBM i change capture into Snowflake with evidence of progress"
readme = "docs/pypi.md"
requires-python = ">=3.12"
keywords = ["ibm-i", "as400", "cdc", "snowflake", "change-data-capture", "replication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: System :: Archiving :: Mirroring",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
dependencies = ["boto3>=1.40,<2", "PyYAML>=6,<7"]

[project.urls]
Homepage = "https://quadringent.github.io/quadringent-ce/"
Source = "https://github.com/quadringent/quadringent-ce"
Documentation = "https://quadringent.github.io/quadringent-ce/docs/getting-started/"
Changelog = "https://github.com/quadringent/quadringent-ce/blob/main/CHANGELOG.md"
Issues = "https://github.com/quadringent/quadringent-ce/issues"
"Security policy" = "https://github.com/quadringent/quadringent-ce/blob/main/SECURITY.md"

[project.optional-dependencies]
site = ["Markdown==3.11"]
dev = [
    "Markdown==3.11",
    "pytest==9.1.1",
    "pyflakes==3.4.0",
    "PyYAML==6.0.3",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "build>=1.2,<2",
    "httpx>=0.27,<1",
    "jsonschema>=4,<5",
]
snowflake = ["snowflake-connector-python>=3.18,<5"]
# Optional Snowpipe Streaming adapter; the default COPY/MERGE path does not require it.
streaming = ["snowpipe-streaming>=1.8,<2"]
gcs = ["google-cloud-storage>=3,<4"]
# Optional v2 API dependencies.
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=50,<51",
    # In-process MCP tools use the ASGI HTTP client.
    "mcp>=2.2,<3",
    "httpx>=0.27,<1",
    # Optional OIDC verification.
    "PyJWT>=2.9,<3",
]

[project.scripts]
quadringent-control-plane = "quadringent_control_plane.cli:main"
quadringent-cost-collect = "quadringent.cost_collect:main"
quadringent = "quadringent.installer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quadringent", "quadringent.*", "quadringent_control_plane", "quadringent_control_plane.*"]
# The qualification harness is available from the source tree, not the runtime wheel.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests", "research", "research/scripts"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["F821", "F822", "F823"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
# Only the explicitly listed modules are type-checked.
follow_imports = "silent"
files = ["src/quadringent_control_plane/version.py"]
